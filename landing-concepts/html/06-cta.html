<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="_shared.css" rel="stylesheet">
<style>
  body{height:620px;background:
    radial-gradient(ellipse 90% 120% at 85% 50%, #22365A 0%, var(--ink) 60%);
    position:relative;display:flex;align-items:center;padding:0 130px;color:#fff}
  .para{position:absolute;right:60px;top:50%;transform:translateY(-52%);font-family:Georgia,serif;font-size:560px;line-height:1;color:rgba(255,255,255,.06);user-select:none}
  .noise{position:absolute;inset:0;opacity:.35;
    background-image:radial-gradient(circle,rgba(255,255,255,.045) 1px,transparent 1px);background-size:22px 22px}
  .inner{position:relative;max-width:760px}
  .eyebrow{color:#9FB2CC;margin-bottom:22px}
  h2{font-family:'Space Grotesk';font-weight:600;font-size:64px;line-height:1.06;letter-spacing:-0.03em;margin-bottom:22px}
  h2 em{font-style:normal;color:#7BD8A3}
  .sub{font-size:18.5px;line-height:1.6;color:#AAB9CE;max-width:560px;margin-bottom:40px}
  .row{display:flex;align-items:center;gap:26px}
  .trust{display:flex;gap:22px;margin-top:36px;font-size:14px;color:#9FB2CC}
  .trust span{display:flex;align-items:center;gap:7px}
  .trust i{font-style:normal;color:#7BD8A3}
</style></head>
<body>
  <div class="noise"></div>
  <div class="para">§</div>
  <div class="inner">
    <div class="eyebrow">Free to start · No card required</div>
    <h2 class="display">Your first job in Germany,<br><em>legally checked.</em></h2>
    <p class="sub">Join the students who stopped guessing what their visa allows — and started interviewing.</p>
    <div class="row">
      <a class="btn btn-primary" style="font-size:18px;padding:20px 42px">Start swiping — free</a>
      <a style="color:#fff;font-weight:600;font-size:16px;border-bottom:1.5px solid rgba(255,255,255,.35);padding-bottom:3px">Talk to us →</a>
    </div>
    <div class="trust">
      <span><i>✓</i> GDPR-compliant</span>
      <span><i>✓</i> EU servers only</span>
      <span><i>✓</i> You always click Apply</span>
    </div>
  </div>
</body></html>
