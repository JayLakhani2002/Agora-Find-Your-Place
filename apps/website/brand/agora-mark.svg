<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The Agora mark: a window with one pane lit.
    Same 32-unit geometry as src/components/ui/Logo.tsx — keep the two in step.

    A favicon can't inherit currentColor, so the frame swaps on prefers-color-scheme:
    ink on light browser chrome, near-white on dark. The lit pane stays apricot in both,
    because that is the part the mark is actually about.
  -->
  <style>
    .frame { stroke: #1E1B3A; }
    @media (prefers-color-scheme: dark) { .frame { stroke: #EDECF7; } }
  </style>
  <defs>
    <clipPath id="w">
      <rect x="4.4" y="4.4" width="23.2" height="23.2" rx="4.4"/>
    </clipPath>
  </defs>
  <g clip-path="url(#w)">
    <rect x="16" y="0" width="16" height="16" fill="#FF9F5A"/>
  </g>
  <rect class="frame" x="4.4" y="4.4" width="23.2" height="23.2" rx="4.4" fill="none" stroke-width="2.6"/>
  <path class="frame" d="M16 4.4V27.6M4.4 16H27.6" stroke-width="2.6"/>
</svg>
