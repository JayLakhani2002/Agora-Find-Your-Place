name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_BEDROCK_REGION: eu-central-1

jobs:
  ci:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm biome check .

      - name: Test
        run: pnpm turbo test

      - name: Build packages (exclude apps)
        run: pnpm turbo build --filter=!@agora/web --filter=!@agora/workers

  db-check:
    name: DB Schema Check
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    env:
      # drizzle-kit check only validates local migration files (no DB connection),
      # but drizzle.config.ts requires the var to be set. Fall back to a placeholder
      # so the job passes even when the DATABASE_URL secret isn't configured.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check migrations are up to date
        run: pnpm --filter=@agora/db db:check
