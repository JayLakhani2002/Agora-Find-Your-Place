<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="_shared.css" rel="stylesheet">
<style>
  body{height:450px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
  .cap{font-size:14px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:54px}
  .logos{display:flex;align-items:center;gap:84px}
  .logo{font-family:'Space Grotesk';font-weight:600;font-size:26px;letter-spacing:-0.02em;color:#9AA8BC}
  .logo.serif{font-family:Georgia,serif;font-weight:700;font-style:italic}
  .logo.caps{letter-spacing:0.08em;font-size:22px}
  .logo.round{font-weight:700;border:2.5px solid #B9C4D4;border-radius:10px;padding:6px 14px;font-size:20px}
  .note{margin-top:56px;font-size:14.5px;color:var(--muted)}
  .note b{color:var(--ink)}
</style></head>
<body>
  <div class="cap">Students landed interviews at</div>
  <div class="logos">
    <div class="logo caps">ZALANDO</div>
    <div class="logo serif">HelloFresh</div>
    <div class="logo round">N26</div>
    <div class="logo">personio</div>
    <div class="logo caps">DELIVERY HERO</div>
    <div class="logo">contentful</div>
  </div>
  <div class="note"><b>2,400+</b> applications drafted this semester — every single one submitted by the student, never by us.</div>
</body></html>
